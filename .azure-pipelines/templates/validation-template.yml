parameters:
  - name: SF_TARGET_CLIENT_ID
    type: string
  - name: SF_TARGET_USERNAME
    type: string
  - name: TARGET_ORG
    type: string

jobs:
  - job: validate_metadata
    pool:
      vmImage: 'ubuntu-latest'
    displayName: Validate Salesforce Metadata Changes

#Checks out the source code from the current repo.
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
        clean: true
     
# Setup Node.js
      - task: UseNode@1
        inputs:
          version: '20.x'

# Install Salesforce CLI, Scanner Plugin, SFDX-Git-Delta
      - script: |
          echo "Installing Salesforce CLI..."
          npm install --global @salesforce/cli
          sf --version

          echo "Installing Salesforce Code Analyzer..."
          sf plugins install code-analyzer

          echo "Installing SFDX-Git-Delta..."
          echo "y" | sf plugins install sfdx-git-delta
        displayName: Install Salesforce Plugins

      - script: |
          sf org login jwt --client-id $(SF_TARGET_CLIENT_ID) \
            --jwt-key-file $(jwtKey.secureFilePath) \
            --username $(SF_TARGET_USERNAME) \
            --instance-url https://login.salesforce.com \
            --alias $(TARGET_ORG)
        displayName: 'Authorize Target Org'

      - script: |
          echo "Checking for changes in package..."

          mkdir -p delta
          mkdir -p validation-results
          touch validation-results/_empty.txt

          echo "Running Code Scan..."
          sf code-analyzer run --target "global-package" --output-file "validation-results/code-scan.csv"

          git fetch origin "${{parameters.sourceBranch}}"
          git fetch origin "${{parameters.targetBranch}}"

          # Get common ancestor (last shared commit) between source and target
          MERGE_BASE=$(git merge-base origin/${{parameters.sourceBranch}} origin/${{parameters.targetBranch}})
          echo "Merge base commit: $MERGE_BASE"
          
          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE"...origin/${{ parameters.sourceBranch }})
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo $CHANGED_FILES | grep -q "^global-package/"; then
            echo "Changes detected in global-package. Running delta analysis..."

            sfdx sgd:source:delta --to origin/${{ parameters.sourceBranch }} --from $MERGE_BASE --output-dir "delta" --source-dir "global-package"
                      
            echo "Delta files:"
            cat delta/package/package.xml
            
            echo "Package to destroy"
            cat delta/destructiveChanges/destructiveChanges.xml

            mkdir -p validation-results/delta-package
            cp delta/package/package.xml validation-results/delta-package/package.xml
            cp delta/destructiveChanges/destructiveChanges.xml validation-results/delta-package/destructiveChanges.xml
            
            if grep -q '<types>' delta/package/package.xml; then
              echo "Running SF dry-run deployment on delta..."
              sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org ${{ parameters.targetOrgAlias }} \
              --test-level RunLocalTests \
              --wait 60 \
              --results-dir validation-results \
              --coverage-formatters cobertura \
              --junit
            else
              echo "Package.xml empty — skipping validation."
            fi
             
          else
            echo "No changes in Global-TPM/global-package. Skipping validation."
            exit 0
          fi
        displayName: 'Delta Detection, Code Scan & Validation'
        continueOnError: false

      - script: |
          if grep -q '<types>' delta/destructiveChanges/destructiveChanges.xml; then
            echo "Running destructive changes, Removing the following components:"
            cat delta/destructiveChanges/destructiveChanges.xml
      
            echo "Deploying destructive changes..."
            sf project deploy validate \
            --manifest delta/destructiveChanges/package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org ${{ parameters.targetOrgAlias }} \
            --test-level RunLocalTests \
            --ignore-warnings \
            --wait 100 \
            --json
          else
            echo "No destructive changes found. Skipping destruction step."
          fi
        displayName: "Delta Destruction to Target Org"
      
      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: 'validation-results'
          ArtifactName: 'ValidationResults'
          publishLocation: 'Container'
        displayName: 'Upload validation artifacts'

      - bash: |
          echo "Checking for JUnit test results..."
          if [ -f "$(System.DefaultWorkingDirectory)/validation-results/junit/junit.xml" ]; then
            echo "Found test-result.xml"
            echo "##vso[task.setvariable variable=publishTests]true"
          else
            echo "No test-result.xml found. Skipping test result publishing."
            echo "##vso[task.setvariable variable=publishTests]false"
          fi
        displayName: "Check for JUnit file"

      - task: PublishTestResults@2
        condition: eq(variables['publishTests'], 'true')
        inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '$(System.DefaultWorkingDirectory)/validation-results/junit/junit.xml'
            failTaskOnFailedTests: true
            testRunTitle: 'Publish Test Results'
      
      - bash: |
          echo "Checking for Cobertura coverage file..."
          if [ -f "$(System.DefaultWorkingDirectory)/validation-results/coverage/cobertura.xml" ]; then
            echo "Found cobertura.xml"
            echo "##vso[task.setvariable variable=publishCoverage]true"
          else
            echo "No cobertura.xml found. Skipping code coverage publishing."
            echo "##vso[task.setvariable variable=publishCoverage]false"
          fi
        displayName: "Check for Cobertura file"

      - task: PublishCodeCoverageResults@2
        condition: eq(variables['publishCoverage'], 'true')
        inputs:
            summaryFileLocation: '$(System.DefaultWorkingDirectory)/validation-results/coverage/cobertura.xml'
            pathToSources: '$(System.DefaultWorkingDirectory)/global-package/'
            failIfCoverageEmpty: true

#      - template: post-pr-comment.yml
#        parameters:
#          prNumber: $(System.PullRequest.PullRequestId)
